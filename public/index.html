<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>urlurlurlurl</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <h1 aria-label="urlurlurlurl"><span>url</span><span>url</span><span>url</span><span>url</span></h1>
    <p class="tagline">짧은 주소를 길게 늘립니다.</p>

    <form class="form" data-form>
      <label for="url">원본 주소</label>
      <input
        id="url"
        name="url"
        type="text"
        inputmode="url"
        autocomplete="url"
        placeholder="https://example.com"
        data-input
      >
      <button type="submit" data-submit>늘리기 <span aria-hidden="true">⟶</span></button>
    </form>

    <p class="message" aria-live="polite" data-message></p>

    <section class="result" data-result hidden>
      <a href="#" target="_blank" rel="noreferrer" data-result-url></a>
      <button type="button" data-copy>복사</button>
      <input type="text" aria-label="직접 복사할 주소" data-manual-copy readonly hidden>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
