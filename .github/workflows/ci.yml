name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - name: Build and start the NAS image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag app-ci:tested .
          docker run --detach --name app-check -p 127.0.0.1:18080:8080 app-ci:tested
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 5 http://127.0.0.1:18080/ > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker logs app-check || true
      - name: Save the tested image for publishing
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: docker save -o "$RUNNER_TEMP/image.tar" app-ci:tested
      - name: Pass image to publish job
        id: artifact
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/tested
          merge-multiple: true
      - name: Publish the tested image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ && ${#RELEASE_TAG} -le 128 ]] || { echo 'Expected vX.Y.Z or vX.Y.Z-suffix'; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load --input "$RUNNER_TEMP/tested/image.tar"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "sha-$GITHUB_SHA" "$RELEASE_TAG"; do
            docker tag app-ci:tested "$image:$tag"
            docker push "$image:$tag"
          done
          digest=$(docker image inspect "$image:$RELEASE_TAG" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$image@" '[.[] | select(startswith($prefix))] | unique | select(length == 1) | .[0]')
          [[ "${digest#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"

  release-asset:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Attach the digest NAS will deploy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          printf '%s\n' "$IMAGE" > image.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern image.txt --dir existing
            cmp existing/image.txt image.txt
          else
            args=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" image.txt --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
