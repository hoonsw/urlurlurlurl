name: 오류 신고
description: 예상과 다른 동작을 다시 확인할 수 있도록 기록합니다.
body:
  - type: textarea
    id: steps
    attributes:
      label: 어떤 순서로 문제가 발생했나요?
      placeholder: 사용 환경과 재현 순서를 적고 예시 데이터는 공개 가능한 값으로 바꿔주세요.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 예상한 결과와 실제 결과
      placeholder: 무엇이 보여야 하는지, 실제로 무엇이 보였는지 적어주세요.
    validations:
      required: true
